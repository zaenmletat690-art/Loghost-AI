<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090812">
  <meta name="description" content="LØGHØST AI - مساعدك الدراسي">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>LØGHØST AI</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L</div>
        <div><div class="brand-name">LØGHØST <span>AI</span></div><div class="brand-sub">مساعدك الدراسي الذكي</div></div>
      </div>
      <button class="icon-btn" id="newChat" aria-label="محادثة جديدة">＋</button>
    </header>

    <main>
      <section class="welcome" id="welcome">
        <div class="orb">✦</div>
        <p class="eyebrow">مرحباً بك في</p>
        <h1>LØGHØST <span>AI</span></h1>
        <p class="welcome-copy">خلّينا نفهم السؤال ونحلّه خطوة بخطوة.</p>
        <div class="subject-grid">
          <button class="subject" data-subject="رياضيات"><b>∑</b><span>رياضيات</span></button>
          <button class="subject" data-subject="علوم"><b>⚛</b><span>علوم</span></button>
          <button class="subject" data-subject="اللغة العربية"><b>ع</b><span>عربي</span></button>
          <button class="subject" data-subject="اللغة الإنجليزية"><b>A</b><span>إنجليزي</span></button>
        </div>
      </section>

      <section class="chat" id="chat" aria-live="polite"></section>
    </main>

    <footer class="composer-wrap">
      <div class="mode-note"><span class="dot"></span> نسخة تجريبية — الواجهة تعمل دون اتصال</div>
      <div class="composer">
        <label class="attach" for="photoInput" title="إرفاق صورة">＋</label>
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
        <textarea id="prompt" rows="1" placeholder="اكتب سؤالك الدراسي هنا..." aria-label="اكتب سؤالك"></textarea>
        <button id="send" class="send" aria-label="إرسال">➤</button>
      </div>
      <div class="disclaimer">هذه نسخة واجهة أولية؛ لم يتم ربط محرك ذكاء اصطناعي بعد.</div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
